<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A5AA6"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Stundenbuch</title>
<style>
:root{--bg:#EEF1F5;--cd:#fff;--tx:#1B2430;--mu:#6B7686;--pr:#2A5AA6;--gr:#55B05C;--rd:#E5534B;--ln:#DDE2EA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151C;--cd:#1A222D;--tx:#E8EDF3;--mu:#93A0B1;--pr:#3F6FBF;--ln:#2A3441}}
:root[data-theme="dark"]{--bg:#10151C;--cd:#1A222D;--tx:#E8EDF3;--mu:#93A0B1;--pr:#3F6FBF;--ln:#2A3441}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--pr);color:#fff}
.top h1{font-size:19px;margin:0;font-weight:600}.top button{color:#fff;font-size:28px;line-height:1;padding:0 6px}.sp{flex:1}
.hero{display:flex;gap:14px;padding:18px 16px 44px;background:var(--pr);color:#fff}
.cell{flex:1;opacity:.5;border-bottom:1px solid #ffffff99}.cell.on{opacity:1}.cell b{display:block;font-size:32px;font-weight:600}.cell small{display:block;padding:4px 0}
.card{background:var(--cd);margin:14px 14px 0;border-radius:8px;box-shadow:0 1px 4px #0003;overflow:hidden}
.hero+.card{margin-top:-30px}
.lb{padding:12px 16px;color:var(--pr);font-weight:600;font-size:14px;border-bottom:1px solid var(--ln)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--ln);background:var(--cd)}
.g{flex:1;min-width:0}.g small{display:block;color:var(--mu)}
.fo{width:22px;height:18px;border-radius:4px;flex:none}
.bt{display:flex}.bt button{flex:1;padding:16px;font-size:19px;color:#fff;letter-spacing:.04em}
.go{background:var(--gr)}.st{background:var(--rd)}.pb{background:var(--pr)}
.sum{display:flex;text-align:center}.sum div{flex:1;padding:14px 4px;border-right:1px solid var(--ln)}.sum div:last-child{border:0}.sum div{cursor:pointer}.sum .on b{color:var(--pr)}.sum .on{box-shadow:inset 0 -3px 0 var(--pr)}.sum b{display:block;font-weight:500;font-size:18px}.sum small{color:var(--mu)}
.wk{display:flex;align-items:center;gap:10px;padding:18px 14px 8px}.wk button{font-size:26px;padding:0 8px}
.day{display:flex;justify-content:space-between;padding:8px 16px;background:var(--ln);font-size:14px;color:var(--mu)}
.tm{font-size:14px;color:var(--mu);text-align:center;min-width:48px}.du{text-align:right;font-weight:600}.du small{display:block;color:var(--gr);font-weight:400}
.nt{white-space:pre-line}
.pad{padding:14px}label{display:block;margin:12px 0 4px;color:var(--mu);font-size:14px}
input,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--tx)}
input[type=color]{height:44px;padding:2px}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px}.chk input{width:auto}
.chip{display:inline-block;margin:10px 8px 0 0;padding:8px 12px;border-radius:18px;background:var(--pr);color:#fff;font-size:14px;cursor:pointer}.chip.alt{background:none;border:1px solid var(--pr);color:var(--pr)}
.add{display:flex;gap:8px;margin-top:10px}.add button,.btns button{padding:12px 16px;border-radius:8px;background:var(--pr);color:#fff}
.btns{display:flex;gap:10px;margin-top:20px}.btns button{flex:1}.btns .sec{background:none;border:1px solid var(--rd);color:var(--rd)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:12px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:1px solid var(--ln);cursor:pointer}.err{color:var(--rd)}
.mh,.mr{display:grid;grid-template-columns:22px 1fr 62px 76px 22px;gap:6px;align-items:center;padding:10px 10px;border-bottom:1px solid var(--ln)}.mh{font-size:12px;color:var(--mu);background:var(--bg)}
.mi{text-align:left;padding:10px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mq{padding:8px 6px}
.mh,.mr{grid-template-columns:20px 1fr 56px 66px 22px;gap:5px}.mr{padding:6px 8px}.mi{padding:8px 6px}
.ml{display:grid;grid-template-columns:20px 1fr 46px 44px 30px;gap:4px;align-items:center;padding:3px 10px;border-bottom:1px solid var(--ln);font-size:14px;line-height:1.2}.ml>span{overflow-wrap:anywhere}.ml.mh{font-size:12px}.ml.del{grid-template-columns:1fr auto auto;background:var(--bg)}.ml.del button{padding:3px 12px}.ml>button{font-size:14px;line-height:1;padding:2px 6px}.lbx{max-height:190px;overflow-y:auto}.ml.tl{grid-template-columns:20px 1fr 30px}.ml.tl .nt{white-space:pre-line}
select{font:inherit;width:100%;padding:10px 2px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--tx)}.nb{display:block;padding:14px;background:var(--gr);color:#fff;border-radius:8px;width:calc(100% - 28px);margin:14px}

/* Modernes, kompakteres Design – reine Gestaltung, keine Änderung der Funktionen */
:root{--bg:#F3F5F9;--cd:#FFFFFF;--tx:#172235;--mu:#738096;--pr:#2859A5;--gr:#43A866;--rd:#DF5555;--ln:#E4E8EF}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101722;--cd:#192331;--tx:#EAF0F7;--mu:#9AA8BA;--pr:#3E70BE;--ln:#2B3747}}
:root[data-theme="dark"]{--bg:#101722;--cd:#192331;--tx:#EAF0F7;--mu:#9AA8BA;--pr:#3E70BE;--ln:#2B3747}
body{font-size:15px;line-height:1.35;padding-bottom:78px}
.top{gap:8px;padding:10px 14px;box-shadow:0 2px 8px #13274718}
.top h1{font-size:18px;letter-spacing:-.2px}
.top button{font-size:24px;padding:0 5px}
.hero{gap:12px;padding:14px 16px 38px}
.cell b{font-size:28px;letter-spacing:-.5px}
.card{margin:10px 12px 0;border-radius:12px;box-shadow:0 2px 9px #1722350b;border:1px solid color-mix(in srgb,var(--ln) 70%,transparent)}
.hero+.card{margin-top:-26px}
.lb{padding:9px 13px;font-size:13px;letter-spacing:.1px}
.row{gap:10px;padding:10px 13px}
.fo{width:18px;height:16px;border-radius:5px}
.bt{gap:8px;padding:9px 10px}
.bt button{padding:10px 8px;border-radius:9px;font-size:15px;font-weight:600;letter-spacing:0;min-height:42px;box-shadow:none}
.go{background:var(--gr)}.st{background:var(--rd)}.pb{background:var(--pr)}
.sum div{padding:10px 4px}
.sum b{font-size:16px}
.wk{gap:8px;padding:12px 12px 6px}
.wk button{font-size:22px;padding:0 7px}
.day{padding:6px 13px;font-size:13px}
.tm{font-size:13px;min-width:44px}
.pad{padding:12px}
label{margin:9px 0 4px;font-size:13px}
input,textarea{padding:9px 10px;border-radius:9px;font-size:15px}
input[type=color]{height:40px}
.chip{margin:7px 6px 0 0;padding:7px 10px;font-size:13px;border-radius:16px}
.add{gap:7px;margin-top:8px;align-items:center}
.add button,.btns button{padding:9px 12px;border-radius:9px;font-size:14px;font-weight:600;min-height:38px}
.btns{gap:8px;margin-top:14px}
.btns button{flex:1}
.bar{gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px #1722350a}
.nb{width:calc(100% - 24px);margin:10px 12px;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:600;min-height:40px}
.mh,.mr{gap:4px;padding:7px 8px}
.mr{padding:4px 7px}
.mi{padding:7px 6px;border-radius:7px;font-size:13px}
.mq{padding:6px 4px;font-size:14px}
select{padding:7px 2px;border-radius:7px;font-size:14px}
.ml{padding:3px 8px;font-size:13px}
.lbx{max-height:180px}
button,.row,.sum div,.bar{-webkit-tap-highlight-color:transparent}
button{transition:filter .15s ease,transform .15s ease}
button:active{filter:brightness(.94);transform:scale(.99)}
@media(min-width:600px){#app{max-width:620px;margin:0 auto}.top{padding-left:18px;padding-right:18px}.card{margin-left:14px;margin-right:14px}}

.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lm{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}.lm>div{background:var(--cd);width:100%;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lm h3{margin:0 0 2px;font-size:17px}.lm p{margin:0 0 10px;color:var(--mu);font-size:14px}.lm button{display:block;width:100%;padding:13px;margin:6px 0;border-radius:10px;font-size:16px;font-weight:600;background:var(--bg);color:var(--tx)}.lm .rd{background:var(--rd);color:#fff}
.wt{border-collapse:collapse;font-size:11px;min-width:640px;background:var(--cd)}.wt td,.wt th{border:1px solid var(--ln);padding:3px 5px;white-space:nowrap}.wt th{background:var(--bg)}.wt tr.dl td{border-top:2px solid var(--tx)}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
let D;try{D=JSON.parse(localStorage.getItem('sb1'))}catch(e){}
D=D||{p:[],e:[],t:null,m:['Schleifpapier','Lack','Grundierung','Vinylboden','Parkett'],lp:null};
D.ta=D.ta||['Alten Boden entfernen','Estrich abschleifen und Kleberreste entfernen','Schleifen und grundieren','Vinylboden verlegt','Fertigparkett verlegt','Leisten montiert und silikoniert'];D.k=D.k||['Marcel','Hermann','Antonitsch'];
const save=()=>{try{localStorage.setItem('sb1',JSON.stringify(D))}catch(e){}};
let V={v:'home',wo:0,rg:'week',dr:[{n:'',q:'',u:'m²'}],ret:'home',ed:null,pe:null,q:'',arch:false,mm:false,dc:0,err:''};
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const fd=ms=>{const m=Math.max(0,Math.round(ms/60000));return pad(Math.floor(m/60))+'h '+pad(m%60)+'m'};
const ft=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const tl=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+ft(ts)};
const DN=['So','Mo','Di','Mi','Do','Fr','Sa'],MN=['Jän.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sep.','Okt.','Nov.','Dez.'];
const fday=ts=>{const d=new Date(ts);return DN[d.getDay()]+'., '+d.getDate()+'. '+MN[d.getMonth()]};
const wk=d=>{d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y)/864e5+1)/7)};
const mon=(o=0)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=id=>D.p.find(p=>p.id===id);
const edur=e=>e.end-e.start-(e.pz||0);
const tpause=(t,n)=>t.pz+(t.ps?n-t.ps:0);
const tdur=(t,n)=>n-t.start-tpause(t,n);
const head=(t,back)=>`<header class="top">${back?'<button data-a="back">‹</button>':'<button data-a="mn" style="font-size:26px">☰</button>'}<h1>${t}</h1><span class="sp"></span>${back?'':'<button data-a="bk">⋮</button>'}</header>`;

function home(L){
 const n=Date.now(),t=D.t,p=P(t?t.pid:D.lp),pz=t?tpause(t,n):0,du=t?tdur(t,n):0;
 const d0=new Date();d0.setHours(0,0,0,0);const w0=+mon(),m0=+new Date(d0.getFullYear(),d0.getMonth(),1);
 const sum=f=>D.e.filter(e=>e.start>=f).reduce((a,e)=>a+edur(e),0)+(t&&t.start>=f?du:0);
 let ws,we,lab;
 if(V.rg==='day'){const x=new Date(d0);x.setDate(x.getDate()+V.wo);ws=+x;x.setDate(x.getDate()+1);we=x;lab=V.wo?fday(ws):'Heute · '+fday(ws)}
 else if(V.rg==='month'){const x=new Date(d0.getFullYear(),d0.getMonth()+V.wo,1);ws=+x;we=new Date(x.getFullYear(),x.getMonth()+1,1);lab=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][x.getMonth()]+' '+x.getFullYear()}
 else{ws=+mon(V.wo);we=new Date(ws);we.setDate(we.getDate()+7);lab='KW '+wk(new Date(ws))+(V.wo?'':' (diese Woche)')}
 const es=D.e.filter(e=>e.start>=ws&&e.start<+we).sort((a,b)=>b.start-a.start);
 const wsum=es.reduce((a,e)=>a+edur(e),0)+(t&&t.start>=ws&&t.start<+we?du:0);
 let h='',k='';
 es.forEach(e=>{const dk=fday(e.start);
  if(dk!==k){k=dk;const ds=es.filter(x=>fday(x.start)===dk).reduce((a,x)=>a+edur(x),0);h+=`<div class="day"><span>${dk}</span><span>${fd(ds)}</span></div>`}
  const q=P(e.pid)||{name:'?',c:'#999'};
  h+=`<div class="row" data-a="edit" data-i="${e.id}"><div class="tm">${ft(e.start)}<br>${ft(e.end)}</div><div class="g"><b style="color:${q.c}">${esc(q.name)}</b><small class="nt">${esc(etext(e))}</small></div><div class="du">${fd(edur(e))}${e.pz?`<small>${fd(e.pz)}</small>`:''}</div></div>`});
 const btn=t?(t.ps?'<button class="go" data-a="resume">Fortsetzen</button>':'<button class="pb" data-a="pause">Pause</button>')+'<button class="st" data-a="stop">Stopp</button>':'<button class="go" data-a="start">Start</button>';
 if(L)return `<header class="top"><button data-a="home"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M5 9l7 7 7-7"/></svg></button><div class="g"><b>${lab}</b></div><b>${fd(wsum)}</b></header><div class="wk" id="wk"><button data-a="wp">‹</button><span class="sp"></span><button data-a="wb" style="font-size:14px;font-weight:600;color:var(--pr)">Wochenbericht (PDF)</button><span class="sp"></span><button data-a="wn">›</button></div>${h||'<p class="pad" style="color:var(--mu)">Keine Einträge in diesem Zeitraum.</p>'}${h?'<p class="pad" style="color:var(--mu);font-size:13px;text-align:center">Tipp: Eintrag lange drücken zum Bearbeiten oder Löschen</p>':''}`;
 return head('Stundenbuch')+`<section class="hero"><div class="cell ${t&&t.ps?'on':''}"><b id="pv">${fd(pz)}</b><small>Pausenzeit</small></div><div class="cell ${t&&!t.ps?'on':''}"><b id="dv">${fd(du)}</b><small>Dauer</small></div></section>
<div class="card"><div class="lb">${t?'Timer (gestartet um '+ft(t.start)+')':'Timer'}</div>
<div class="row" data-a="pick"><i class="fo" style="background:${p?p.c:'#999'}"></i><div class="g"><b>${p?esc(p.name):'Projekt wählen'}</b></div>›</div><div class="bt">${btn}</div></div>
<div class="card"><div class="lb">Dauer</div><div class="sum"><div data-a="rg" data-i="day" class="${V.rg==='day'?'on':''}"><b>${fd(sum(+d0))}</b><small>Tag</small></div><div data-a="rg" data-i="week" class="${V.rg==='week'?'on':''}"><b>${fd(sum(w0))}</b><small>Woche</small></div><div data-a="rg" data-i="month" class="${V.rg==='month'?'on':''}"><b>${fd(sum(m0))}</b><small>Monat</small></div></div></div>
<div class="bar" data-a="open"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 15l7-7 7 7"/></svg><div class="g"><b>${lab}</b></div><b>${fd(wsum)}</b></div>`}

function plist(){const q=V.q.toLowerCase();
 return D.p.filter(p=>(V.arch||!p.arch)&&(!q||[p.name,p.nr,p.cl].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.last||0)-(a.last||0))
 .map(p=>`<div class="row" data-a="sel" data-i="${p.id}"><i class="fo" style="background:${p.c}"></i><div class="g"><b>${esc(p.name)}</b><small>${esc([p.nr&&'Prj.nr '+p.nr,p.cl,p.arch&&'abgeschlossen'].filter(Boolean).join(' · '))}</small></div><button data-a="pedit" data-i="${p.id}">✎</button></div>`).join('')||'<p class="pad">Noch keine Projekte. Lege unten dein erstes Projekt an.</p>'}
function proj(){return head('Projekt wählen',1)+`<div class="pad"><input id="q" placeholder="Suchen (Name, Nummer, Auftraggeber)" value="${esc(V.q)}"><label class="chk"><input type="checkbox" id="arch" ${V.arch?'checked':''}> Abgeschlossene anzeigen</label></div><div id="pl">${plist()}</div><button class="nb" data-a="pnew">＋ Neues Projekt</button>`}

function pedit(){const p=V.pe;return head(p.n?'Neues Projekt':'Projekt bearbeiten',1)+`<div class="pad">${V.err?`<p class="err">${V.err}</p>`:''}<label>Projektname<input id="pn" value="${esc(p.name)}"></label><label>Projektnummer<input id="pr" inputmode="numeric" value="${esc(p.nr)}"></label><label>Auftraggeber<input id="pc" value="${esc(p.cl)}"></label><label>Farbe<input id="pf" type="color" value="${p.c}"></label><label class="chk"><input id="pa" type="checkbox" ${p.arch?'checked':''}> Abgeschlossen (in der Auswahl ausblenden)</label><div class="btns"><button data-a="psave">Speichern</button></div></div>`}

function eedit(){const e=V.ed,p=P(e.pid);
 return head('Eintrag bearbeiten',1)+`<div class="pad">${V.err?`<p class="err">${V.err}</p>`:''}
<div class="row" data-a="pick"><i class="fo" style="background:${p?p.c:'#999'}"></i><div class="g"><b>${p?esc(p.name):'Projekt wählen'}</b></div>›</div>
<label>Beginn<input type="datetime-local" id="s" value="${tl(e.start)}"></label>
<label>Ende<input type="datetime-local" id="en" value="${tl(e.end)}"></label>
<label>Pause (Minuten)<input type="number" id="pz" min="0" value="${Math.round((e.pz||0)/60000)}"></label>
${acc('n','Notiz',e.note?'✓':'','')}<div style="display:${V.sc==='n'?'block':'none'}"><label>Notiz<textarea id="nt" rows="5">${esc(e.note)}</textarea></label></div>
${acc('m','Material',(e.mt||[]).length,mt4(e,1))}${acc('t','Tätigkeiten',(e.ta||[]).length,tkp(e,0,1))}${acc('k','Mit auf der Baustelle',(e.kl||[]).length,tkp(e,1,1))}
<div class="btns"><button class="sec" data-a="del">${V.dc?'Wirklich löschen?':'Löschen'}</button><button data-a="esave">Speichern</button></div></div>`}

const U=['m²','m¹','l','Stk.','kg','Pkg.'];
function mtable(e,f){const r=e.mt||[];return `<div class="card" style="${f?'margin:14px 0 0':''}"><div class="lb">Material</div><div class="mh"><span>Nr.</span><span>Material / Beschreibung</span><span>Menge</span><span>Einheit</span><span></span></div>${r.map((x,i)=>`<div class="mr"><b>${i+1}</b><button class="mi" data-a="mpick" data-i="${i}">${esc(x.n)||'Material wählen'}</button><input class="mq" type="number" inputmode="decimal" data-i="${i}" value="${esc(x.q)}"><select class="mu" data-i="${i}">${U.map(u=>`<option${u===x.u?' selected':''}>${u}</option>`).join('')}</select><button data-a="mdel" data-i="${i}">✕</button></div>`).join('')}<button class="nb" data-a="madd2" style="margin:12px;width:calc(100% - 24px)">＋ Material hinzufügen</button></div>`}
function mt2(e,f){const r=e.mt||[],d=V.nr;
